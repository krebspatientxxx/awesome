<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hCaptcha Verifizierung</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🛡️ hCaptcha Test</h1>
    <p>Verifiziere dich mit hCaptcha</p>

    <form id="captchaForm">
      <div id="captcha-container"></div>
      
      <div class="button-group">
        <button type="submit" class="btn btn-primary" id="verifyBtn">
          <span class="btn-icon">✓</span>
          <span class="btn-text">Verifizieren</span>
        </button>
        <button type="button" class="btn btn-secondary" onclick="resetForm()">
          <span class="btn-icon">↻</span>
          <span class="btn-text">Zurücksetzen</span>
        </button>
      </div>
    </form>

    <div id="result" class="result hidden"></div>

    <div class="footer">
      <a href="/test" target="_blank" class="link">🧪 Test Dashboard</a>
      <span class="separator">•</span>
      <a href="https://docs.hcaptcha.com" target="_blank" class="link">📚 Dokumentation</a>
    </div>
  </div>

  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
  <script src="app.js"></script>
</body>
</html>
